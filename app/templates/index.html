{% extends "base.html" %}
{% block content %}
<div class="card">
    <div class="toolbar">
        <form class="search" method="get" action="{{ url_for('main.index') }}">
            <input type="text" name="q" placeholder="Search name, email or course" value="{{ q }}">
            <button class="btn" type="submit">Search</button>
        </form>
        <a class="btn" href="{{ url_for('main.add_student') }}">+ Add Student</a>
    </div>

    <table>
        <thead>
            <tr>
                <th>ID</th>
                <th>Name</th>
                <th>Email</th>
                <th>Course</th>
                <th>Year</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody>
            {% for s in students %}
            <tr>
                <td>{{ s.id }}</td>
                <td>{{ s.name }}</td>
                <td>{{ s.email }}</td>
                <td>{{ s.course }}</td>
                <td>{{ s.year }}</td>
                <td>
                    <a class="btn gray" href="{{ url_for('main.edit_student', student_id=s.id) }}">Edit</a>
                    <form class="inline" method="post" action="{{ url_for('main.delete_student', student_id=s.id) }}"
                        onsubmit="return confirm('Delete this student?');">
                        <button class="btn danger" type="submit">Delete</button>
                    </form>
                </td>
            </tr>
            {% else %}
            <tr>
                <td colspan="6">No students found.</td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</div>
{% endblock %}
