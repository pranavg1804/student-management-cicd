{% extends "base.html" %}
{% block content %}
<div class="card">
    <h2>{{ title }}</h2>
    <form method="post">
        <label for="name">Name</label>
        <input id="name" name="name" value="{{ student.name or '' }}" required>

        <label for="email">Email</label>
        <input id="email" name="email" type="email" value="{{ student.email or '' }}" required>

        <label for="course">Course</label>
        <input id="course" name="course" value="{{ student.course or '' }}" required>

        <label for="year">Year (1-6)</label>
        <input id="year" name="year" type="number" min="1" max="6" value="{{ student.year or '' }}" required>

        <p>
            <button class="btn" type="submit">Save</button>
            <a class="btn gray" href="{{ url_for('main.index') }}">Cancel</a>
        </p>
    </form>
</div>
{% endblock %}
