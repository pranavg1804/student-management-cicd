<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Student Management System{% endblock %}</title>
    <style>
        body {
            font-family: Segoe UI, Arial, sans-serif;
            background: #f4f6f9;
            margin: 0;
            color: #222;
        }

        header {
            background: #1f3a5f;
            padding: 16px 32px;
        }

        header a {
            color: #fff;
            text-decoration: none;
            font-size: 1.4rem;
            font-weight: 600;
        }

        main {
            max-width: 900px;
            margin: 24px auto;
            padding: 0 16px;
        }

        .card {
            background: #fff;
            border-radius: 8px;
            padding: 20px;
            box-shadow: 0 1px 4px rgba(0, 0, 0, .1);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 12px;
        }

        th,
        td {
            text-align: left;
            padding: 10px;
            border-bottom: 1px solid #e5e7eb;
        }

        th {
            background: #f0f3f8;
        }

        .btn {
            display: inline-block;
            padding: 8px 14px;
            border: none;
            border-radius: 6px;
            background: #2563eb;
            color: #fff;
            text-decoration: none;
            cursor: pointer;
            font-size: .9rem;
        }

        .btn.danger {
            background: #dc2626;
        }

        .btn.gray {
            background: #6b7280;
        }

        .toolbar {
            display: flex;
            gap: 8px;
            justify-content: space-between;
            flex-wrap: wrap;
        }

        input {
            padding: 8px;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            width: 100%;
            box-sizing: border-box;
        }

        label {
            display: block;
            margin: 12px 0 4px;
            font-weight: 600;
        }

        .search {
            display: flex;
            gap: 8px;
        }

        .flash {
            padding: 10px 14px;
            border-radius: 6px;
            margin-bottom: 12px;
        }

        .flash.success {
            background: #dcfce7;
            color: #166534;
        }

        .flash.error {
            background: #fee2e2;
            color: #991b1b;
        }

        form.inline {
            display: inline;
        }
    </style>
</head>

<body>
    <header><a href="{{ url_for('main.index') }}">Student Management System</a></header>
    <main>
        {% with messages = get_flashed_messages(with_categories=true) %}
        {% for category, message in messages %}
        <div class="flash {{ category }}">{{ message }}</div>
        {% endfor %}
        {% endwith %}
        {% block content %}{% endblock %}
    </main>
</body>

</html>
